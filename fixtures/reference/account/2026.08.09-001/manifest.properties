# effective.ts is therefore the publication instant and not a business
# effective date, because no source stated one. Nothing here invents a
# provenance it does not have, and no consumer may infer one.
#
# reference.max-age IS DELIBERATELY ABSENT. The freshness contract is A-4's to
# define. Every loader carries the check, wired and INERT, and logs that it is
# inert on every run; none of them invents a number. When A-4 lands, the number
# is added here and the loaders start enforcing it with no code change.
#
# checksum.sha256 is over the BYTES of account.csv, exactly as committed.
# Recompute with:  shasum -a 256 account.csv
# Validate the whole artifact with:  scripts/verify-account-reference.sh
