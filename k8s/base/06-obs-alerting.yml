                  reducer: "last"
                  settings:
                    mode: ""
              - refId: "C"
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: "C"
                  datasource:
                    type: "__expr__"
                    uid: "__expr__"
                  type: "threshold"
                  expression: "B"
                  conditions:
                    - type: "query"
                      evaluator:
                        type: "gt"
                        params:
                          - 0
                      operator:
                        type: "and"
                      query:
                        params:
