                  from: 0
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: "C"
                  datasource:
                    type: "__expr__"
                    uid: "__expr__"
                  type: "threshold"
                  expression: "B"
                  conditions:
                    - type: "query"
                      evaluator:
                        type: "gt"
                        params:
                          - 0
                      operator:
                        type: "and"
                      query:
                        params:
                          - "B"
                      reducer:
                        type: "last"
                        params: []
          - uid: "dcre-collector-absent"
            title: "DCRE OTLP collector absent"
            condition: "C"
            for: "15s"
            noDataState: "OK"
            execErrState: "Alerting"
            isPaused: false
            labels:
              severity: "critical"
              system: "dcre"
            annotations:
              summary: "The OTLP collector {{ $labels.job }} has stopped reporting; the fleet is flying blind."
              description: "No up sample from job={{ $labels.job }} for 30s; the absence indicator reads {{ $values.B }}. Every metric, log and trace in this fleet arrives through this collector, so its silence means every OTHER panel and rule is reading history rather than the present. WHAT up IS HERE, which is not what it usually is: the bundle's Prometheus has NO scrape_configs at all. up{job=\"otelcol-contrib\"} is the collector's own prometheus/collector receiver scraping 127.0.0.1:8888 every 1s and PUSHING the result through the OTLP pipeline. It is therefore a pushed series like every other, which is why this is absent_over_time and not up == 0: a dead collector cannot report itself down, so up == 0 would never be true. WHY a 30s window: MEASURED as count_over_time(up{job=\"otelcol-contrib\"}[30s]) = 30 on 2026-09-11, a 1s step, so the window is 30 intervals. WHAT THIS CANNOT SEE: the collector, Prometheus, Alertmanager and Grafana are one pod. If the POD dies, the evaluator dies with it and nothing here fires. That watchdog has to live outside the pod and does not yet exist."
              runbook: "kubectl --context kind-dcre-dev -n dcre get pod -l app.kubernetes.io/name=lgtm ; kubectl --context kind-dcre-dev -n dcre logs deploy/lgtm --tail=200 | grep -i otelcol ; kubectl --context kind-dcre-dev -n dcre exec deploy/lgtm -- curl -s localhost:13133/ready"
            data:
              - refId: "A"
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: "A"
                  datasource:
                    type: "prometheus"
                    uid: "prometheus"
                  expr: "absent_over_time(up{job=\"otelcol-contrib\"}[30s])"
                  instant: true
                  range: false
                  editorMode: "code"
                  legendFormat: "__auto"
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: "B"
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: "B"
                  datasource:
                    type: "__expr__"
                    uid: "__expr__"
                  type: "reduce"
                  expression: "A"
                  reducer: "last"
