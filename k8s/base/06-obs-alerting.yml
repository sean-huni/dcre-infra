                      reducer:
                        type: "last"
                        params: []
          - uid: "dcre-stage-batch-job-failed"
            title: "DCRE stage Spring Batch job executions ended FAILED"
            condition: "C"
            for: "15s"
            noDataState: "OK"
            execErrState: "Alerting"
            isPaused: false
            labels:
              severity: "critical"
              system: "dcre"
            annotations:
              summary: "{{ $labels.job }} has Spring Batch job executions in status FAILED."
              description: "{{ $labels.job }} reported {{ $values.B }} Spring Batch job executions with spring_batch_job_status=FAILED inside the last 15m. Measured 2026-09-11: dcre-mrg 29, dcre-crg 15, dcre-cix 1, dcre-cpx 1, dcre-csx 1. WHY THE CUMULATIVE COUNTER AND NOT increase(): a stage service is a Spring Batch job inside a Kubernetes Job. It exports ONCE and the pod exits, so the next execution is a new pod, a new instance label and therefore a NEW SERIES carrying exactly one sample. rate() and increase() both need two samples on ONE series inside the window, so both are EMPTY here by construction, forever. Red-proofed on the live datasource on 2026-09-11: sum by (job) (increase(spring_batch_job_milliseconds_count{spring_batch_job_status=\"FAILED\"}[5m])) returned 0 series while the expression above returned 5. WHY NOT THE X - X offset FORM either: a cumulative difference assumes the series at T and at T minus the offset are the SAME series. Here they are different pods, so the subtraction would compare unrelated counters. last_over_time over an explicit window sums each ephemeral pod's own count and states its universe instead of inheriting Prometheus's lookback flag."
              runbook: "kubectl --context kind-dcre-dev -n dcre get jobs --sort-by=.metadata.creationTimestamp | tail -20 ; kubectl --context kind-dcre-dev -n dcre logs job/<name> --tail=200 ; kubectl --context kind-dcre-dev -n dcre get pods --field-selector=status.phase=Failed"
            data:
              - refId: "A"
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: "A"
                  datasource:
                    type: "prometheus"
                    uid: "prometheus"
                  expr: "sum by (job) (last_over_time(spring_batch_job_milliseconds_count{spring_batch_job_status=\"FAILED\"}[15m]))"
                  instant: true
                  range: false
                  editorMode: "code"
                  legendFormat: "__auto"
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: "B"
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: "B"
                  datasource:
                    type: "__expr__"
                    uid: "__expr__"
                  type: "reduce"
                  expression: "A"
                  reducer: "last"
                  settings:
                    mode: ""
