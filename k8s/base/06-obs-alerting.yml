    # return their own job, and stamping one job over all of them makes Prometheus
    # refuse the whole rule with "vector contains metrics with the same labelset after
    # applying alert labels" the moment TWO services are absent, which is precisely the
    # case such a rule exists for.
    #
    # Every summary names {{ $labels.job }} and every description carries the number
    # that triggered it and a runbook line to paste.
    apiVersion: 1
    groups:
      - orgId: 1
        name: "dcre-fleet"
        folder: "DCRE Alerts"
        interval: "30s"
        rules:
          - uid: "dcre-orchestrator-absent"
            title: "DCRE orchestrator absent"
            condition: "C"
            for: "15s"
            noDataState: "OK"
            execErrState: "Alerting"
            isPaused: false
            labels:
              severity: "critical"
              system: "dcre"
            annotations:
              summary: "The DCRE orchestrator {{ $labels.job }} has stopped exporting telemetry."
              description: "No target_info sample from job={{ $labels.job }} for 3m; the absence indicator reads {{ $values.B }} (1 means absent). The orchestrator is a single-replica Deployment and the fleet stops without it: nothing leases, nothing launches, no stage Job is created. WHY absent_over_time AND NOT absent: this fleet PUSHES over OTLP. A scrape target that disappears gets a staleness marker and absent() sees it; a push exporter that stops gets none, so absent() keeps reading the last sample for Prometheus's five minute lookback and the alert never fires. WHY a 3m window: agt exports on a 60s step, MEASURED as count_over_time(target_info{job=\"agt\"}[3m]) = 3 on 2026-09-11. The window is three intervals, so one late export cannot be read as a death. Detection latency is therefore up to 3m plus 15s."
              runbook: "kubectl --context kind-dcre-dev -n dcre get pods -l app=dcre-agt ; kubectl --context kind-dcre-dev -n dcre logs deploy/dcre-agt --tail=200 ; kubectl --context kind-dcre-dev -n dcre describe deploy/dcre-agt"
            data:
              - refId: "A"
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: "A"
                  datasource:
                    type: "prometheus"
                    uid: "prometheus"
                  expr: "absent_over_time(target_info{job=\"agt\"}[3m])"
                  instant: true
                  range: false
                  editorMode: "code"
                  legendFormat: "__auto"
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: "B"
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: "B"
                  datasource:
                    type: "__expr__"
                    uid: "__expr__"
                  type: "reduce"
                  expression: "A"
                  reducer: "last"
