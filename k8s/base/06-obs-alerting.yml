          - uid: "dcre-sla-breach-red"
            title: "DCRE SLA breached waiting for a Fintegrate response"
            condition: "C"
            for: "15s"
            noDataState: "OK"
            execErrState: "Alerting"
            isPaused: false
            labels:
              severity: "critical"
              system: "dcre"
            annotations:
              summary: "{{ $labels.client }} {{ $labels.flow }} has transactions past the red SLA ({{ $labels.job }})."
              description: "{{ $values.B }} transactions for client {{ $labels.client }} on flow {{ $labels.flow }} have waited past the red SLA threshold (default 24h) for a Fintegrate response. Measured 2026-09-11: FNBRF01 COL = 51. AGGREGATED WITH max(), NOT sum(): this is a GAUGE polled from the database by every agt pod, so every pod reports the same number and overlapping pod generations would multiply the fleet's own restarts into the figure. Same convention as the Overview board. The amber counterpart that the superseded HTTP-API alert script alerted on does not exist: count(dcre_sla_pending_amber) returns 0 series and the metric name is absent from this Prometheus entirely."
              runbook: "Open the DCRE Fleet Overview board, SLA pending (red) panel, at this time range ; kubectl --context kind-dcre-dev -n dcre logs deploy/dcre-agt --tail=200 | grep -i sla ; escalate to Fintegrate per the response-leg runbook"
            data:
              - refId: "A"
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: "A"
                  datasource:
                    type: "prometheus"
                    uid: "prometheus"
                  expr: "max by (job, client, flow) (dcre_sla_pending_red)"
                  instant: true
                  range: false
                  editorMode: "code"
