                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "__expr__"
                model:
                  refId: "C"
                  datasource:
                    type: "__expr__"
                    uid: "__expr__"
                  type: "threshold"
                  expression: "B"
                  conditions:
                    - type: "query"
                      evaluator:
                        type: "gt"
                        params:
                          - 0
                      operator:
                        type: "and"
                      query:
                        params:
                          - "B"
                      reducer:
                        type: "last"
                        params: []
          - uid: "dcre-database-unreachable"
            title: "DCRE fleet cannot obtain a database connection"
            condition: "C"
            for: "15s"
            noDataState: "OK"
            execErrState: "Alerting"
            isPaused: false
            labels:
              severity: "critical"
              system: "dcre"
            annotations:
              summary: "{{ $labels.job }} timed out acquiring a CockroachDB connection."
              description: "{{ $labels.job }} reported {{ $values.B }} Hikari connection-acquisition timeouts inside the last 15m. A pool that cannot hand out a connection is the fleet-side signature of CockroachDB being unreachable, unhealthy, or out of connection capacity. READ THE LIMIT OF THIS RULE BEFORE TRUSTING IT. CockroachDB publishes NOTHING into this Prometheus. Measured 2026-09-11: crdb-0 serves 18406 lines on http://localhost:8080/_status/vars and NOTHING scrapes them, the bundle's prometheus.yaml has no scrape_configs, and label_values(job) is exactly agt, dcre-*, otelcol-contrib. So there is no such thing as a direct \"CockroachDB absent\" rule on this cluster today and this is the closest honest proxy: it detects a database outage only once something TRIES to use the database and fails, and the things that try are ephemeral Kubernetes Jobs. An outage in the gap between two Job executions is invisible to it. The fix is to give CockroachDB a scrape path into this Prometheus; until then this rule is a smoke detector in one room of the house."
              runbook: "kubectl --context kind-dcre-dev -n dcre get pod crdb-0 ; kubectl --context kind-dcre-dev -n dcre exec crdb-0 -- ./cockroach sql --insecure --execute 'SELECT 1' ; kubectl --context kind-dcre-dev -n dcre logs crdb-0 --tail=200"
            data:
              - refId: "A"
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: "A"
                  datasource:
                    type: "prometheus"
                    uid: "prometheus"
                  expr: "sum by (job) (last_over_time(hikaricp_connections_timeout_total[15m]))"
                  instant: true
                  range: false
                  editorMode: "code"
                  legendFormat: "__auto"
                  intervalMs: 1000
