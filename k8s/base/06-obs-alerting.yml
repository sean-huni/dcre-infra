  dcre-contact-points.yaml: |
    # GENERATED by scripts/obs-alerting.py. DO NOT EDIT.
    #
    # THE WEBHOOK URL IS NOT IN THIS FILE AND NEVER WILL BE. The value below is the
    # literal string $DCRE_SLACK_WEBHOOK_URL, which Grafana expands from its own process
    # environment at provisioning time. 04-lgtm.yml supplies it from the OPTIONAL
    # Secret dcre-alerting-slack, key webhook-url, which is NOT in this repository and
    # NOT in kustomize base, so `kubectl apply -k` can never overwrite a populated one.
    #
    # This file is SEPARATE from the rules file on purpose: Grafana validates an
    # alerting provisioning file as a unit, and a contact point that fails validation
    # must not be able to take the rules down with it.
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: "dcre-slack"
        receivers:
          - uid: "dcre-slack-webhook"
            type: "slack"
            settings:
              url: "$DCRE_SLACK_WEBHOOK_URL"
              title: "{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}"
              text: "{{ range .Alerts }}*{{ .Labels.alertname }}*  severity={{ .Labels.severity }}  job={{ .Labels.job }}\n{{ .Annotations.summary }}\n{{ .Annotations.description }}\nRUNBOOK: {{ .Annotations.runbook }}\n{{ end }}"
            disableResolveMessage: false
    policies:
      - orgId: 1
        receiver: "dcre-slack"
        group_by:
          - "alertname"
          - "job"
        group_wait: "10s"
        group_interval: "1m"
        repeat_interval: "4h"
