apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-grafana
  namespace: dcre
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: dcre
spec:
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: dcre
  labels:
    app.kubernetes.io/name: lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO PVC: never two pods on the volume
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
    spec:
      containers:
        - name: lgtm
          # verified latest stable 2026-07-15 (Grafana 13.1.0, Prometheus 3.13.1 inside);
          # no Alpine variant exists for this bundle image
          image: grafana/otel-lgtm:0.29.0
          env:
            # Grafana state (orgs/users/dashboards) onto the PVC so restarts keep them
            - name: GF_PATHS_DATA
              value: /data/grafana
            # snapshots embed result data and would bypass org walls (spec section 7)
            - name: GF_SNAPSHOTS_EXTERNAL_ENABLED
              value: "false"
            - name: GF_SNAPSHOTS_PUBLIC_MODE
              value: "false"
            # These two exist so the file-provisioning proof is FALSIFIABLE.
            #
            # The claim behind the DCRE dashboards is that they arrive from a file and
            # never from POST /api/dashboards/db. An absence found by searching proves
            # nothing unless the search could have found something, and by default this
            # bundle discards Grafana's log entirely (run_with_logging sends it to
            # /dev/null unless ENABLE_LOGS_GRAFANA is true) while Grafana itself logs no
            # requests at all (router_logging defaults to false). With both off, "zero
            # dashboard POSTs in the log" is true of a log that could not have recorded
            # one, which is not evidence.
            #
            # With both on, the log carries every request, so the POSTs that DO happen
            # (/api/ds/query when a board loads, /api/frontend-metrics) are the positive
            # control, and zero POSTs to /api/dashboards/db beside them is a measurement.
            - name: ENABLE_LOGS_GRAFANA
              value: "true"
            - name: GF_SERVER_ROUTER_LOGGING
              value: "true"
            # The Slack webhook for the provisioned contact point. The VALUE is never in
            # this repository: it arrives from a Secret that is deliberately NOT in
            # kustomize base, so `kubectl apply -k` can never overwrite a populated one.
            #
            # optional: true is what makes the alerting half CORRECT AND INERT on a clean
            # clone. With no Secret the variable is simply unset, the pod still starts, the
            # rules still load and evaluate, and the contact point is provisioned with an
            # unexpanded reference that delivers nowhere. Populate it with one command:
            #
            #   kubectl -n dcre create secret generic dcre-alerting-slack \
            #     --from-literal=webhook-url="$DCRE_SLACK_WEBHOOK_URL" \
            #     --dry-run=client -o yaml | kubectl apply -f -
            #   kubectl -n dcre rollout restart deploy/lgtm
            #
            # Grafana reads provisioning files ONCE at startup, so the restart is the half
            # that is easy to forget and the reason the command above is two lines.
            - name: DCRE_SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: dcre-alerting-slack
                  key: webhook-url
                  optional: true
          ports:
            - containerPort: 3000
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: grafana-data
              mountPath: /data/grafana
            # DCRE OTLP dashboards, delivered by Grafana FILE PROVISIONING and never by
            # POST /api/dashboards/db. Both mounts come from the one ConfigMap that
            # scripts/obs-dashboards.py generates (05-obs-dashboards.yml).
            #
            # The provider lands as a single file INSIDE the image's own provisioning
            # directory, via subPath. Mounting the directory instead would shadow
            # grafana-dashboards.yaml and grafana-datasources.yaml and take the bundle's
            # own boards and the Prometheus/Loki/Tempo datasources down with it.
            #
            # That directory is /otel-lgtm/grafana/conf/provisioning and NOT
            # $GF_PATHS_HOME/conf/provisioning: run-grafana.sh sets GF_PATHS_HOME to
            # /data/grafana but launches `./bin/grafana server` from /otel-lgtm/grafana
            # with no --homepath, so Grafana resolves the default relative provisioning
            # path against its working directory. Verified in the running pod on
            # 2026-09-11: /data/grafana/conf does not exist, and the bundle's own
            # provisioning files are the ones under /otel-lgtm.
            - name: dcre-dashboards-provider
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/dcre-provider.yaml
              subPath: dcre-provider.yaml
              readOnly: true
            - name: dcre-dashboards
              mountPath: /etc/dcre/dashboards
              readOnly: true
            # DCRE alert rules and the Slack contact point, delivered by the same Grafana
            # FILE PROVISIONING mechanism as the dashboards and never by
            # POST /api/v1/provisioning/... . Generated by scripts/obs-alerting.py into
            # 06-obs-alerting.yml.
            #
            # subPath, not a directory mount: mounting the directory would shadow the
            # bundle's own alerting/sample.yaml.
            #
            # ONLY THE RULES ARE MOUNTED HERE, and that is the whole lesson of this
            # change. dcre-contact-points.yaml is projected by the volume below but
            # mounted only by k8s/overlays/alerting-slack, because Grafana does not skip
            # a provisioning file it cannot validate: it fails the entire provisioning
            # module, every module that depends on it, and therefore the HTTP server.
            # Measured 2026-09-11: with DCRE_SLACK_WEBHOOK_URL unset, the Slack receiver
            # fell through to the chat API, demanded a recipient, and Grafana sat 0/1 for
            # six minutes with no dashboards and no datasources. Splitting the rules and
            # the contact point into two FILES did not contain that; only not mounting
            # the second one does.
            - name: dcre-alerting
              mountPath: /otel-lgtm/grafana/conf/provisioning/alerting/dcre-alert-rules.yaml
              subPath: dcre-alert-rules.yaml
              readOnly: true
          # BestEffort criticals forbidden (CRDB OOM lesson 2026-07-13)
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: lgtm-grafana
        # Two volumes, one ConfigMap. `items` on each keeps the provider YAML out of the
        # dashboard directory and the dashboard JSON out of Grafana's provisioning
        # directory, so neither mount can pick up a file meant for the other.
        - name: dcre-dashboards-provider
          configMap:
            name: dcre-obs-dashboards
            items:
              - key: dcre-provider.yaml
                path: dcre-provider.yaml
        - name: dcre-dashboards
          configMap:
            name: dcre-obs-dashboards
            items:
              - key: dcre-fleet-overview.json
                path: dcre-fleet-overview.json
              - key: dcre-stage-jobs.json
                path: dcre-stage-jobs.json
              - key: dcre-traces.json
                path: dcre-traces.json
              - key: dcre-logs.json
                path: dcre-logs.json
        - name: dcre-alerting
          configMap:
            name: dcre-obs-alerting
            items:
              - key: dcre-alert-rules.yaml
                path: dcre-alert-rules.yaml
              - key: dcre-contact-points.yaml
                path: dcre-contact-points.yaml
