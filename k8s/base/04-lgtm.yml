apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-grafana
  namespace: dcre
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: dcre
spec:
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: dcre
  labels:
    app.kubernetes.io/name: lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO PVC: never two pods on the volume
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
    spec:
      containers:
        - name: lgtm
          # verified latest stable 2026-07-15 (Grafana 13.1.0, Prometheus 3.13.1 inside);
          # no Alpine variant exists for this bundle image
          image: grafana/otel-lgtm:0.29.0
          env:
            # Grafana state (orgs/users/dashboards) onto the PVC so restarts keep them
            - name: GF_PATHS_DATA
              value: /data/grafana
            # snapshots embed result data and would bypass org walls (spec section 7)
            - name: GF_SNAPSHOTS_EXTERNAL_ENABLED
              value: "false"
            - name: GF_SNAPSHOTS_PUBLIC_MODE
              value: "false"
          ports:
            - containerPort: 3000
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: grafana-data
              mountPath: /data/grafana
          # BestEffort criticals forbidden (CRDB OOM lesson 2026-07-13)
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: lgtm-grafana
