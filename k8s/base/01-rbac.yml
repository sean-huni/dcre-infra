apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcre-agt
  namespace: dcre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dcre-agt-role
  namespace: dcre
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dcre-agt-rolebinding
  namespace: dcre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dcre-agt-role
subjects:
  - kind: ServiceAccount
    name: dcre-agt
    namespace: dcre
