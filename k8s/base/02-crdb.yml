apiVersion: v1
kind: ConfigMap
metadata:
  name: crdb-init
  namespace: dcre
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS dcre_collections;
    CREATE DATABASE IF NOT EXISTS agt_ops;
---
apiVersion: v1
kind: Service
metadata:
  name: crdb
  namespace: dcre
spec:
  selector:
    app.kubernetes.io/name: crdb
  ports:
    - name: sql
      port: 26257
      targetPort: 26257
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crdb
  namespace: dcre
  labels:
    app.kubernetes.io/name: crdb
spec:
  serviceName: crdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crdb
    spec:
      containers:
        - name: crdb
          image: cockroachdb/cockroach:v26.2.3
          args: ["start-single-node", "--insecure"]
          ports:
            - containerPort: 26257
          volumeMounts:
            - name: data
              mountPath: /cockroach/cockroach-data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["cockroach", "sql", "--insecure", "-e", "SELECT 1"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: crdb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
