apiVersion: v1
kind: ConfigMap
metadata:
  name: crdb-init
  namespace: dcre
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS dcre_col;
    CREATE DATABASE IF NOT EXISTS agt_ops;
    CREATE DATABASE IF NOT EXISTS dcre_man;
    -- SCRUM-107: payments owns its own database. Until this existed, the payments
    -- lane ran in the dcre-pay Kubernetes namespace while writing dcre_col, which
    -- is namespace isolation without data isolation.
    -- Keep in lockstep with scripts/crdb-init.sql: this ConfigMap is the k8s
    -- bootstrap authority, that file is the compose one, and a database added to
    -- only one of them exists in only one environment.
    CREATE DATABASE IF NOT EXISTS dcre_pay;
    -- SCRUM-107: hcs is a shared-reference CONTEXT with its own database, and
    -- it earns one because it has a real upstream it ingests from (the
    -- Nager.Date API, on a six-hour sync) and a single accountable owner. A
    -- database is named for the context that OWNS it, so it takes the service's
    -- name rather than a topic name.
    --
    -- THERE IS NO dcre_acs, and adding one back is a design reversal, not a
    -- fix. A second such database was created on 2026-08-08 for `acs`, an
    -- account registry, and RETIRED on 2026-08-09: unlike hcs it had no
    -- authoritative source, no accountable owner, no ingestion of its own and
    -- no freshness contract, which made it a shared integration database
    -- wearing the costume of a bounded context, and it put a runtime dependency
    -- on the first validation gate of all three families for 110 static fixture
    -- rows. Account reference data now travels as ONE immutable versioned
    -- artifact under fixtures/reference/account/ and each context materialises
    -- its OWN projection into its OWN database. FIVE databases, not six.
    CREATE DATABASE IF NOT EXISTS dcre_hcs;   -- hcs: public_holiday
---
apiVersion: v1
kind: Service
metadata:
  name: crdb
  namespace: dcre
spec:
  selector:
    app.kubernetes.io/name: crdb
  ports:
    - name: sql
      port: 26257
      targetPort: 26257
    - name: db-console
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crdb
  namespace: dcre
  labels:
    app.kubernetes.io/name: crdb
spec:
  serviceName: crdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crdb
    spec:
      containers:
        - name: crdb
          image: cockroachdb/cockroach:v26.2.3
          # Cap cache + SQL memory to absolute values. Without these, CRDB sizes
          # them off perceived node RAM (no cgroup awareness with an unbounded
          # pod) and over-allocates. Sizing proven live under the 100x50k chaos
          # cycle (A-51, 2026-07-13): total RSS runs ~2x the managed budgets under
          # write load (2Gi limit was cgroup-OOM-killed repeatedly), and the R-41
          # content-dedup scan grows with retained tx_entry volume, so SQL memory
          # dominates cache for this workload.
          args:
            - "start-single-node"
            - "--insecure"
            - "--cache=256MiB"
            - "--max-sql-memory=1024MiB"
          ports:
            - containerPort: 26257
            - containerPort: 8080
          # Reserve memory so the scheduler stops overcommitting the node against
          # the DB. Request stays 2Gi (a 4Gi request would starve stage pods on an
          # 8Gi node); the 4Gi limit gives the ~2x-budget RSS headroom A-51 measured.
          # No CPU limit so the readiness probe is never CPU-throttled during
          # batch waves.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /cockroach/cockroach-data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["cockroach", "sql", "--insecure", "-e", "SELECT 1"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: init
          configMap:
            name: crdb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
