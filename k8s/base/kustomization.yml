apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dcre-base

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: dcre
      app.kubernetes.io/managed-by: kustomize

resources:
  - 00-namespace.yml
  - 01-rbac.yml
  - 02-crdb.yml
  - 03-exchange-pvc.yml
  - 04-lgtm.yml
  # GENERATED by scripts/obs-dashboards.py. Must be listed BEFORE nothing and applied
  # WITH 04-lgtm.yml: the Deployment mounts it, so applying the Deployment without it
  # leaves the pod unschedulable on a missing ConfigMap.
  - 05-obs-dashboards.yml
