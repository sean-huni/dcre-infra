# SCRUM-70: every namespace that runs stage Jobs needs its OWN PVC named
# dcre-exchange (PVCs are namespace-scoped; JobLauncher mounts by that name),
# each bound to its OWN PV over the SAME hostPath. A PV binds exactly one
# claim, so each pair gets a distinct storageClassName as the binding key.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dcre-exchange-pv
  labels:
    app.kubernetes.io/part-of: dcre
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteMany"]
  storageClassName: dcre-exchange
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /dcre-exchange
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dcre-exchange
  namespace: dcre
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: dcre-exchange
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dcre-exchange-col
